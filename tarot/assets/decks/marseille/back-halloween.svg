  <text x="130" y="418" text-anchor="middle" font-family="Georgia, serif" font-size="9.5" letter-spacing="3.5" fill="#c1b49e" opacity="0.7">ALKEMIJANA</text>
  <!-- Halloween: vinjeta + šišmiši (tools/halloween-backs.js) -->
  <defs><radialGradient id="hwVig" cx="50%" cy="48%" r="70%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.72"/></radialGradient></defs><rect x="0" y="0" width="260" height="442" fill="url(#hwVig)"/>
  <g transform="translate(186 104) rotate(-12) scale(0.5)" fill="#000"><path d="M-2 -2 Q-9.5 -7.5 -17 -6 L-43 -9 Q-32.8 -1.7 -40 2 Q-28.2 3.9 -32 9 Q-21.2 6.9 -20 10 Q-8.6 6.7 -3 6 Z"/><path d="M-2 -2 Q-9.5 -7.5 -17 -6 L-43 -9 Q-32.8 -1.7 -40 2 Q-28.2 3.9 -32 9 Q-21.2 6.9 -20 10 Q-8.6 6.7 -3 6 Z" transform="scale(-1 1)"/><ellipse cx="0" cy="2.5" rx="3.3" ry="6.8"/><circle cx="0" cy="-5" r="3"/><path d="M-2.7 -6.3 L-2.4 -11.2 L-0.5 -7.4 Z M2.7 -6.3 L2.4 -11.2 L0.5 -7.4 Z"/></g><g transform="translate(212 128) rotate(8) scale(0.3)" fill="#000"><path d="M-2 -2 Q-9.5 -7.5 -17 -6 L-43 -9 Q-32.8 -1.7 -40 2 Q-28.2 3.9 -32 9 Q-21.2 6.9 -20 10 Q-8.6 6.7 -3 6 Z"/><path d="M-2 -2 Q-9.5 -7.5 -17 -6 L-43 -9 Q-32.8 -1.7 -40 2 Q-28.2 3.9 -32 9 Q-21.2 6.9 -20 10 Q-8.6 6.7 -3 6 Z" transform="scale(-1 1)"/><ellipse cx="0" cy="2.5" rx="3.3" ry="6.8"/><circle cx="0" cy="-5" r="3"/><path d="M-2.7 -6.3 L-2.4 -11.2 L-0.5 -7.4 Z M2.7 -6.3 L2.4 -11.2 L0.5 -7.4 Z"/></g>
