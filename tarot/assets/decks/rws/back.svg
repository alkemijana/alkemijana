<svg xmlns="http://www.w3.org/2000/svg" width="260" height="442" viewBox="0 0 260 442" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="rwsBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#3a2d78"/>
      <stop offset="52%" stop-color="#221a52"/>
      <stop offset="100%" stop-color="#0c0925"/>
    </radialGradient>
    <linearGradient id="rwsGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dffb"/>
      <stop offset="50%" stop-color="#b9a2e6"/>
      <stop offset="100%" stop-color="#8f76c8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="260" height="442" fill="url(#rwsBg)"/>
  <rect x="12" y="12" width="236" height="418" rx="12" fill="none" stroke="url(#rwsGold)" stroke-width="3"/>
  <rect x="20" y="20" width="220" height="402" rx="8" fill="none" stroke="#b9a2e6" stroke-width="1" opacity="0.6"/>

  <!-- središnji mandala/kompas motiv -->
  <g transform="translate(130,221)">
    <circle r="92" fill="none" stroke="url(#rwsGold)" stroke-width="2"/>
    <circle r="66" fill="none" stroke="#b9a2e6" stroke-width="1.4" opacity="0.85"/>
    <circle r="40" fill="none" stroke="url(#rwsGold)" stroke-width="1.8"/>

    <!-- 8 zraka -->
    <g stroke="url(#rwsGold)" stroke-width="2">
      <path d="M0,-92 L0,-40"/><path d="M0,92 L0,40"/>
      <path d="M-92,0 L-40,0"/><path d="M92,0 L40,0"/>
      <path d="M-65,-65 L-28,-28"/><path d="M65,65 L28,28"/>
      <path d="M65,-65 L28,-28"/><path d="M-65,65 L-28,28"/>
    </g>

    <!-- osmerokraka zvijezda u sredini -->
    <path d="M0,-38 L9,-9 L38,0 L9,9 L0,38 L-9,9 L-38,0 L-9,-9 Z" fill="url(#rwsGold)" opacity="0.95"/>
    <path d="M0,-24 L6,-6 L24,0 L6,6 L0,24 L-6,6 L-24,0 L-6,-6 Z" fill="#1a1440"/>
    <circle r="7" fill="url(#rwsGold)"/>

    <!-- točke na obodu -->
    <g fill="#e8dffb">
      <circle cx="0" cy="-92" r="4"/><circle cx="0" cy="92" r="4"/>
      <circle cx="-92" cy="0" r="4"/><circle cx="92" cy="0" r="4"/>
      <circle cx="-65" cy="-65" r="3"/><circle cx="65" cy="65" r="3"/>
      <circle cx="65" cy="-65" r="3"/><circle cx="-65" cy="65" r="3"/>
    </g>
  </g>

  <!-- kutne zvjezdice -->
  <g fill="#e8dffb" opacity="0.9">
    <circle cx="42" cy="52" r="2.4"/><circle cx="218" cy="52" r="2.4"/>
    <circle cx="42" cy="390" r="2.4"/><circle cx="218" cy="390" r="2.4"/>
    <circle cx="130" cy="44" r="2"/><circle cx="130" cy="398" r="2"/>
  </g>

  <text x="130" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#b9a2e6" opacity="0.7">ALKEMIJANA</text>
